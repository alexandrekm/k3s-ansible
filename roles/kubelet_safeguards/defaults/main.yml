---
# Kubelet node safeguards. k3s writes its own kubelet configuration drop-in
# (00-k3s-defaults.conf) holding only a two-entry evictionHard map, so a node
# reports no memory or inode eviction threshold and no reserved resources:
# reported allocatable equals reported capacity.
#
# Set kubelet_node_safeguards to have this role write
# 90-kubelet-node-safeguards.conf next to it. kubelet merges the drop-in
# directory in lexical order with a JSON merge patch, so the 90- file wins and
# must be complete: map fields such as evictionHard are replaced wholesale,
# never merged key by key. That is also why these values cannot go through
# extra_agent_args: --eviction-hard is parsed the same way and would silently
# drop the two thresholds k3s already sets.
#
# Example (see the homelab deployment runbook for measured values):
#
#   kubelet_node_safeguards:
#     reservations:
#       memory: 1Gi
#       cpu: 250m
#     eviction_hard:
#       memory.available: 512Mi
#       nodefs.available: 10%
#       nodefs.inodesFree: 5%
#       imagefs.available: 10%
#       imagefs.inodesFree: 5%
#     # Optional. Omit to keep k3s's own 85/80 defaults.
#     image_gc:
#       high: 85
#       low: 80
#       minimum_age: 2m
#
# An empty mapping writes nothing, so the kubelet configuration stays exactly
# what k3s produces.
kubelet_node_safeguards: {}

# kubelet subtracts kubeReserved and systemReserved from the node's allocatable
# resources regardless of enforcement. Enforcement is separate: with "pods"
# kubelet caps the pod cgroup at that reduced allocatable, which is what stops
# workloads from consuming the reserve. Do not drop "pods"; without it a
# reservation only shrinks reported capacity. The reserved cgroups are
# deliberately not enforced, because kubelet only enforces cgroups that already
# exist and would otherwise put a memory ceiling around the k3s process itself.
kubelet_safeguards_enforcement_settings:

# Image GC thresholds are percentage-based, which means the absolute size of
# the GC band scales with the root disk. Measured 2026-11-09 on 80G worker
# roots (76.4G usable) at the k3s defaults of 85/80:
#
#   GC high (85%)  64.9G used   11.5G free   <- GC starts here
#   GC low  (80%)  61.1G used   15.3G free   <- GC stops here
#   eviction (10%) 68.8G used    7.6G free
#
# The band is only ~4G wide and sits ~4G above the eviction line, so a burst
# between GC cycles can cross into eviction before GC runs at all. worker-2
# did exactly that on 2026-11-06, reaching 9.2% free.
#
# Lowering the thresholds is NOT a free fix: GC high has to stay above the
# node's normal working set or GC runs continuously and re-pulls images. On
# these nodes the ordinary working set is 53-63G (69-82% of 76.4G), so 80/70
# would put worker-1 (82.3%) permanently above the high threshold. That is
# why the homelab keeps 85/80 and instead grew the free space: pruning unused
# images took worker-1 from 14G to 23G free and worker-2 from 23G to 42G.
#
# Prefer raising capacity or pruning images over moving these thresholds.
  - pods

# k3s data directory, where k3s keeps its kubelet drop-in directory.
kubelet_safeguards_data_dir: /var/lib/rancher/k3s

# Service whose kubelet must restart to pick up the drop-in. site.yml sets this
# to k3s on control-plane nodes and to k3s-node on agent nodes.
kubelet_safeguards_service: k3s-node
